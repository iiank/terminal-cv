<!DOCTYPE html>
<html lang="en-GB" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- Applied before the stylesheet paints, so a visitor whose system or saved
     choice is light mode never sees a dark flash. The storage key must stay in
     step with STORAGE_KEY in src/composables/useTheme.js. -->
<script>
  (function () {
    var theme = 'dark';
    try {
      var saved = localStorage.getItem('terminal-cv-theme');
      if (saved === 'light' || saved === 'dark') {
        theme = saved;
      } else if (window.matchMedia('(prefers-color-scheme: light)').matches) {
        theme = 'light';
      }
    } catch (error) {
      /* Private browsing blocks storage. The dark default still applies. */
    }
    document.documentElement.dataset.theme = theme;
  }());
</script>
